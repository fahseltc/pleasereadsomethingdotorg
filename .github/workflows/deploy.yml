name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 is the current LTS. Astro 7 requires Node >= 22.23.4 (see
          # "engines" in package.json), so CI must not pin an older major.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Fresh events from book-events-aggregator (best-effort) ---
      # The aggregator is a separate repo that crawls event sources into JSON.
      # We check it out, run its pipeline, and copy the FILTERED output into
      # src/data/events.json so the site builds with up-to-date events.
      #
      # Every aggregator step is best-effort: it does live web crawling that can
      # be slow or flaky (sites down, bot-blocked, timeouts). If anything fails,
      # we fall back to the events.json already committed in this repo and still
      # build + deploy. A flaky bookstore site must never break the site deploy.
      - name: Check out book-events-aggregator
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: fahseltc/book-events-aggregator
          path: book-events-aggregator

      - name: Install aggregator deps + headless browser
        id: agg_setup
        continue-on-error: true
        working-directory: book-events-aggregator
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run aggregator pipeline (crawl + filter)
        id: agg_run
        if: steps.agg_setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: book-events-aggregator
        run: npm run pipeline

      - name: Sync filtered events into the site
        if: steps.agg_run.outcome == 'success'
        continue-on-error: true
        run: npm run sync:events -- --from book-events-aggregator/output/events-filtered.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        # Custom domain (pleasereadsomething.org) serves from the root, so the
        # build uses the site/base pinned in astro.config.mjs. We intentionally
        # do NOT feed configure-pages' base_path here — for a project repo it
        # would wrongly inject the /<repo>/ subpath even under a custom domain.
        #
        # Contact addresses are injected from repo secrets so they aren't in the
        # source. Astro reads PUBLIC_* env vars at build time. Set these under
        # Settings → Secrets and variables → Actions:
        #   PUBLIC_CONTACT_EMAIL, PUBLIC_ADMIN_EMAIL
        # (NOTE: they render into the published HTML — "secret" here just means
        # "not stored in the repo", not hidden from visitors.)
        env:
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_ADMIN_EMAIL: ${{ secrets.PUBLIC_ADMIN_EMAIL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
